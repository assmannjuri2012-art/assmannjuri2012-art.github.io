<style>
:root {
	--gold: #e8b64c;
	--pink: #ff3d8b;
	--text: #eef0f6;
	--dim: #9aa0b4;
	--bg: #07080c;
}
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body {
	background: var(--bg);
	color: var(--text);
	overflow: hidden;
	touch-action: none;
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
#canvas { display: block; }
#canvas:focus { outline: none; }

#loader {
	position: fixed;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 18px;
	padding: 24px;
	box-sizing: border-box;
	text-align: center;
	background:
		radial-gradient(ellipse at 50% 120%, rgba(232, 182, 76, 0.18), transparent 60%),
		radial-gradient(ellipse at 50% -20%, rgba(255, 61, 139, 0.12), transparent 55%),
		var(--bg);
	z-index: 2;
	transition: opacity 0.5s ease;
}
#loader.gone { opacity: 0; pointer-events: none; }
.kicker { color: var(--pink); letter-spacing: 0.32em; font-size: 13px; font-weight: 700; }
h1 {
	margin: 0;
	font-size: clamp(34px, 7vw, 68px);
	line-height: 0.95;
	letter-spacing: 0.04em;
	color: var(--gold);
	text-shadow: 0 0 28px rgba(232, 182, 76, 0.35);
}
.sub { color: var(--text); letter-spacing: 0.3em; font-size: 15px; font-weight: 600; }
.bar {
	width: min(520px, 86vw);
	height: 8px;
	border-radius: 8px;
	background: rgba(255, 255, 255, 0.08);
	overflow: hidden;
	margin-top: 22px;
}
.bar > div {
	height: 100%;
	width: 0;
	border-radius: 8px;
	background: linear-gradient(90deg, var(--gold), #ffd98a);
	transition: width 0.25s ease;
}
.bar.busy > div {
	width: 35%;
	animation: slide 1.2s ease-in-out infinite;
}
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
#status { color: var(--dim); font-size: 15px; min-height: 20px; }
#tip { color: var(--dim); font-size: 14px; max-width: 560px; opacity: 0.85; min-height: 38px; }
.keys { color: var(--dim); font-size: 13px; max-width: 640px; line-height: 1.7; }
.keys b {
	display: inline-block;
	min-width: 18px;
	padding: 1px 6px;
	margin: 0 2px;
	border: 1px solid rgba(255, 255, 255, 0.25);
	border-radius: 4px;
	color: var(--text);
	font-weight: 600;
	font-size: 12px;
}
#notice {
	display: none;
	max-width: 560px;
	padding: 16px 20px;
	border-radius: 10px;
	background: rgba(255, 61, 139, 0.12);
	border: 1px solid rgba(255, 61, 139, 0.45);
	line-height: 1.45;
	white-space: pre-line;
}
#notice button, .btn {
	margin-top: 12px;
	padding: 10px 22px;
	border: 0;
	border-radius: 8px;
	background: var(--gold);
	color: #1b1406;
	font-weight: 700;
	font-size: 15px;
	cursor: pointer;
}
.back { position: fixed; left: 16px; top: 14px; color: var(--dim); font-size: 14px; text-decoration: none; z-index: 3; }
.back:hover { color: var(--text); }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript><p style="padding:24px">Operation Syndicate needs JavaScript and WebGL 2 to run in the browser.</p></noscript>

<a class="back" id="back" href="https://assmannjuri2012-art.github.io/">&larr; About the game</a>
<div id="loader" role="status" aria-live="polite">
	<div class="kicker">THE CASINO SYNDICATE</div>
	<h1>OPERATION<br>SYNDICATE</h1>
	<div class="sub">GRAND CASINO</div>
	<div class="bar busy" id="bar"><div></div></div>
	<div id="status">Loading…</div>
	<div id="tip"></div>
	<div class="keys">
		<b>W</b><b>A</b><b>S</b><b>D</b> move &nbsp; <b>Mouse</b> look &nbsp; <b>Left click</b> shoot &nbsp; <b>Right click</b> aim &nbsp;
		<b>E</b> interact &nbsp; <b>F</b> enter car &nbsp; <b>Tab</b> weapons &nbsp; <b>M</b> map &nbsp; <b>Esc</b> pause &nbsp; Gamepad works too.
	</div>
	<div id="notice"></div>
</div>

<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2408544,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loader = document.getElementById('loader');
	const bar = document.getElementById('bar');
	const fill = bar.firstElementChild;
	const status = document.getElementById('status');
	const notice = document.getElementById('notice');
	const tip = document.getElementById('tip');
	const back = document.getElementById('back');
	const TIPS = [
		'Hold Tab to open the weapon wheel – time slows down while you choose.',
		'Press Q next to a wall to take cover; aim to peek out and shoot.',
		'Lose the police by leaving the search area while they cannot see you.',
		'The Lucky Wheel in the Grand Meridian gives one free spin every 24 hours.',
		'Heist preparation decides how the final job plays out. Choose wisely.',
		'Your progress is saved in this browser – come back any time and press Continue.',
	];
	let tipIndex = Math.floor(Math.random() * TIPS.length);
	tip.textContent = TIPS[tipIndex];
	const tipTimer = setInterval(() => {
		tipIndex = (tipIndex + 1) % TIPS.length;
		tip.textContent = TIPS[tipIndex];
	}, 6000);

	function showNotice(text, buttonText, onClick) {
		notice.textContent = text;
		if (buttonText) {
			const b = document.createElement('button');
			b.textContent = buttonText;
			b.addEventListener('click', onClick);
			notice.appendChild(document.createElement('br'));
			notice.appendChild(b);
		}
		notice.style.display = 'block';
	}

	function fail(err) {
		console.error(err);
		bar.style.display = 'none';
		status.textContent = '';
		const msg = (err instanceof Error) ? err.message : String(err || 'Unknown error');
		showNotice('The game could not start: ' + msg + '\nTry the latest Chrome, Edge or Firefox on a computer.');
	}

	function mb(bytes) {
		return (bytes / 1048576).toFixed(1);
	}

	function start() {
		notice.style.display = 'none';
		status.textContent = 'Downloading the game…';
		engine.startGame({
			onProgress: function (current, total) {
				if (current > 0 && total > 0) {
					bar.classList.remove('busy');
					fill.style.width = Math.min(100, (current / total) * 100).toFixed(1) + '%';
					status.textContent = current >= total ? 'Starting the engine…' : 'Downloading the game… ' + mb(current) + ' / ' + mb(total) + ' MB';
				} else {
					bar.classList.add('busy');
				}
			},
		}).then(() => {
			clearInterval(tipTimer);
			loader.classList.add('gone');
			back.style.display = 'none';
			setTimeout(() => loader.remove(), 600);
		}, fail);
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail(new Error('your browser is missing ' + missing.join(', ') + '.'));
		return;
	}
	// Phones and tablets without a mouse or keyboard: say so, but let people try.
	const touchOnly = window.matchMedia('(pointer: coarse)').matches && !window.matchMedia('(any-pointer: fine)').matches;
	if (touchOnly) {
		bar.style.display = 'none';
		status.textContent = '';
		showNotice('Operation Syndicate is made for a computer with keyboard and mouse (or a gamepad). ' +
			'On a phone or tablet it is a large download (about 37 MB) and cannot be controlled by touch.', 'Load anyway', () => {
			bar.style.display = '';
			start();
		});
		return;
	}
	start();
}());
</script>
</body>
</html>
